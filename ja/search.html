やるべき 3 つのことを紹介します。\",\"tags\":[\"gstackインストール\",\"gstackチュートリアル\",\"claude-code-skills\",\"claude-code\",\"AI開発ワークフロー\",\"gstackクイックスタート\",\"AI生産性ツール\"],\"cover\":\"$undefined\",\"readingTime\":\"7 min read\",\"faq\":\"$undefined\",\"pillar\":\"$undefined\",\"relatedSlugs\":\"$undefined\"},{\"slug\":\"Gstack/03-gstack-plan-review\",\"title\":\"Plan Review デュアルモード：CEO 思考 + エンジニアアーキテクチャ、なぜ分けて使うのか\",\"date\":\"2026-04-19\",\"lastModified\":\"$undefined\",\"description\":\"Gstack の /plan-ceo-review と /plan-eng-review はフレームワーク全体で最も投資対効果の高い 2 つの skill です。一方は「やるべきか」を問い、もう一方は「どうやれば正しいか」を問います——分けて使うことで、それぞれが最大の効果を発揮します。\",\"tags\":[\"gstack plan review\",\"claude-code\",\"AIアーキテクチャ設計\",\"AIプロダクト思考\",\"plan-ceo-review\",\"plan-eng-review\",\"gstackチュートリアル\",\"AI開発ワークフロー\"],\"cover\":\"$undefined\",\"readingTime\":\"9 min read\",\"faq\":\"$undefined\",\"pillar\":\"$undefined\",\"relatedSlugs\":\"$undefined\"},{\"slug\":\"Gstack/04-gstack-code-review-and-ship\",\"title\":\"Code Review と Ship：偏執的レビューからワンクリック納品まで\",\"date\":\"2026-04-19\",\"lastModified\":\"$undefined\",\"description\":\"Gstack の /review が探すのはタイポではなく、CI を通過しても production でクラッシュするような問題です。/ship は sync、test、push、PR を 1 つのコマンドに圧縮します。この記事では各々が何をチェックしているか、どう組み合わせるかを解説します。\",\"tags\":[\"gstack review\",\"gstack ship\",\"claude-code コードレビュー\",\"AIコードレビュー\",\"自動化コードレビュー\",\"gstackチュートリアル\",\"claude-code\",\"AI開発ワークフロー\"],\"cover\":\"$undefined\",\"readingTime\":\"9 min read\",\"faq\":\"$undefined\",\"pillar\":\"$undefined\",\"relatedSlugs\":\"$undefined\"},{\"slug\":\"Gstack/05-gstack-qa-and-browse\",\"title\":\"QA と Browse：AI に目を与えて、アプリを本当に「見せる」\",\"date\":\"2026-04-19\",\"lastModified\":\"$undefined\",\"description\":\"ほとんどの AI アシスタントはコードを書き終わったら終わりです——アプリが動いている様子を見ることができません。Gstack の /qa と /browse がこれを変えます：永続化 Chromium、100-200ms のコマンド遅延、diff-aware テスト、0-100 のヘルススコア。\",\"tags\":[\"gstack qa\",\"gstack browse\",\"AI自動化テスト\",\"playwrightブラウザテスト\",\"claude-code qa\",\"gstackチュートリアル\",\"AIビジュアルテスト\",\"フロントエンド自動化テスト\"],\"cover\":\"$undefined\",\"readingTime\":\"10 min read\",\"faq\":\"$undefined\",\"pillar\":\"$undefined\",\"relatedSlugs\":\"$undefined\"},{\"slug\":\"Gstack/06-gstack-real-world-workflow\",\"title\":\"実際の開発シナリオ：新機能から production までの Gstack 完全ワークフロー\",\"date\":\"2026-04-19\",\"lastModified\":\"$undefined\",\"description\":\"前の 5 記事の Gstack skill をつなぎ合わせ、実際のシナリオでデモします：/plan-ceo-review から始まり、/ship で終わるまで。1 人で、9 つのロール、繰り返し実行できる開発リズム。\",\"tags\":[\"gstackワークフロー\",\"claude-code workflow\",\"AI開発フロー\",\"gstack完全チュートリアル\",\"AIバーチャル開発チーム\",\"gstackチュートリアル\",\"claude-code skills\",\"AI生産性\"],\"cover\":\"$undefined\",\"readingTime\":\"12 min read\",\"faq\":\"$undefined\",\"pillar\":\"$undefined\",\"relatedSlugs\":\"$undefined\"},{\"slug\":\"GSD/00-gsd-beginner-course\",\"title\":\"GSD 入門コース：6本の記事でAIを使って本当に物事をやり遂げる\",\"date\":\"2026-04-16\",\"lastModified\":\"$undefined\",\"description\":\"Get Shit Done（GSD）はまたひとつの時間管理術ではない——もっと根本的な問題を修正するものだ：AIツールもあり、計画もあり、やる気もある、でも成果が出てこない。このシリーズはその「なぜ」と「どう直すか」を分解する。\",\"tags\":[\"GSD\",\"get-shit-done\",\"AI生産性\",\"AIワークフロー\",\"実行力\",\"タスク完了\",\"AIツール\",\"生産性メソッド\"],\"cover\":\"$undefined\",\"readingTime\":\"7 min read\",\"faq\":\"$undefined\",\"pillar\":\"$undefined\",\"relatedSlugs\":\"$undefined\"},{\"slug\":\"GSD/01-what-is-gsd\",\"title\":\"なぜAIを使っても物事を終わらせられないのか？GSDの問題診断\",\"date\":\"2026-04-16\",\"lastModified\":\"$undefined\",\"description\":\"ChatGPTもCursorも大量のAIツールもある——でもタスクリストは溢れたまま、大事なことは終わっていない。問題はツールではなく、いくつかの非常に具体的な実行の断点にある。GSDはここから診断を始める。\",\"tags\":[\"GSD\",\"get-shit-done\",\"AI生産性\",\"実行力\",\"完了率\",\"AIツール\",\"生産性診断\",\"タスク管理\"],\"cover\":\"$undefined\",\"readingTime\":\"9 min read\",\"faq\":\"$undefined\",\"pillar\":\"$undefined\",\"relatedSlugs\":\"$undefined\"},{\"slug\":\"GSD/02-gsd-mindset\",\"title\":\"Done \u003e Perfect：GSDの核心メンタル、計画の罠から本当に動き出すまで\",\"date\":\"2026-04-16\",\"lastModified\":\"$undefined\",\"description\":\"完璧主義はあなたを永遠に準備中にさせる。GSDのメンタルの核心はただ一つ：完成したものは、完成しない完璧な計画より永遠に価値がある。この記事では、脳の中で「十分だ」の閾値を再設定する方法を語る。\",\"tags\":[\"GSD\",\"done-over-perfect\",\"完璧主義\",\"実行力\",\"AI生産性\",\"メンタル\",\"デリバリー\",\"完了率\"],\"cover\":\"$undefined\",\"readingTime\":\"10 min read\",\"faq\":\"$undefined\",\"pillar\":\"$undefined\",\"relatedSlugs\":\"$undefined\"},{\"slug\":\"GSD/03-ai-task-breakdown\",\"title\":\"AIでタスクを分解する：曖昧な要件から実行可能なリストへの完全フロー\",\"date\":\"2026-04-16\",\"lastModified\":\"$undefined\",\"description\":\"「Xをやる」は意図であって、タスクではない。曖昧さは完了率最大の敵だ。この記事では、AIを使って曖昧な目標を今日すぐ動ける具体的なステップに分解する方法を教える——長いリストではなく、より明確な次の一歩だ。\",\"tags\":[\"GSD\",\"AIタスク分解\",\"タスク管理\",\"実行可能リスト\",\"AI生産性\",\"AIワークフロー\",\"要件の明確化\",\"タスク分解\"],\"cover\":\"$undefined\",\"readingTime\":\"11 min read\",\"faq\":\"$undefined\",\"pillar\":\"$undefined\",\"relatedSlugs\":\"$undefined\"},{\"slug\":\"GSD/04-execution-loop\",\"title\":\"実行ループ：AI Agentをトラックの上に留めるリズム設計\",\"date\":\"2026-04-16\",\"lastModified\":\"$undefined\",\"description\":\"AIはよく突っ走るが、方向はあなたが決める。GSDの実行ループ設計で、「起動」から「締め」まで明確なリズムを持つ——AIを自由に走らせるのではなく、あなたが設定したトラックで走らせ、終わったら本当に終わりと言える。\",\"tags\":[\"GSD\",\"実行ループ\",\"AIワークフロー\",\"AI Agent\",\"リズム設計\",\"AI生産性\",\"タスク起動\",\"仕事の締め\"],\"cover\":\"$undefined\",\"readingTime\":\"12 min read\",\"faq\":\"$undefined\",\"pillar\":\"$undefined\",\"relatedSlugs\":\"$undefined\"},{\"slug\":\"GSD/05-common-traps\",\"title\":\"GSDの三大罠：なぜ計画が多いほど完了が少ないのか\",\"date\":\"2026-04-16\",\"lastModified\":\"$undefined\",\"description\":\"頑張っているのに何も完成しないという三つのよくあるパターンがある。態度の問題ではなく、識別でき、修正できる実行の罠だ。GSDはここでそれを明確にする。\",\"tags\":[\"GSD\",\"実行の罠\",\"計画の罠\",\"完璧主義\",\"AI生産性\",\"生産性の障壁\",\"AIツールの誤用\",\"タスク完了率\"],\"cover\":\"$undefined\",\"readingTime\":\"11 min read\",\"faq\":\"$undefined\",\"pillar\":\"$undefined\",\"relatedSlugs\":\"$undefined\"},{\"slug\":\"GSD/06-real-world-gsd\",\"title\":\"リアルシーンGSD：コード、記事、提案の三種タスクの実戦ルーティン\",\"date\":\"2026-04-16\",\"lastModified\":\"$undefined\",\"description\":\"GSDの方法論をどうリアルな仕事に落とし込むか？この記事では、コード開発、記事執筆、提案準備の三つの最も一般的なタスクタイプで、完整な起動→実行→締めのリズムを示す。今日からそのまま使える。\",\"tags\":[\"GSD\",\"実戦ルーティン\",\"AI生産性\",\"コード開発ワークフロ
